<!DOCTYPE html>

<html class="dark" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #131318;
            overflow: hidden;
        }
        .aurora-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 20% 30%, rgba(124, 92, 255, 0.15) 0%, transparent 40%),
                        radial-gradient(circle at 80% 70%, rgba(45, 212, 191, 0.1) 0%, transparent 40%);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "text-primary": "#F7F9FA",
                        "on-secondary": "#002d6c",
                        "on-tertiary-container": "#00302a",
                        "error-container": "#93000a",
                        "surface-container-high": "#2a292f",
                        "aurora-violet": "#7C5CFF",
                        "on-primary-fixed-variant": "#4816cb",
                        "aurora-blue": "#4F8CFF",
                        "text-secondary": "#A0A9BE",
                        "error": "#ffb4ab",
                        "surface-variant": "#35343a",
                        "on-error-container": "#ffdad6",
                        "outline-variant": "#484555",
                        "on-error": "#690005",
                        "secondary-fixed-dim": "#afc6ff",
                        "secondary-container": "#045ecf",
                        "primary-fixed": "#e6deff",
                        "surface-container": "#1f1f24",
                        "on-tertiary-fixed": "#00201c",
                        "surface-container-highest": "#35343a",
                        "on-background": "#e4e1e9",
                        "on-surface": "#e4e1e9",
                        "tertiary-container": "#00a392",
                        "surface-container-low": "#1b1b20",
                        "outline": "#938ea1",
                        "on-secondary-fixed": "#001a43",
                        "aurora-teal": "#2DD4BF",
                        "secondary-fixed": "#d9e2ff",
                        "tertiary-fixed": "#62fae3",
                        "surface": "#131318",
                        "glass-fill": "rgba(255, 255, 255, 0.07)",
                        "on-tertiary-fixed-variant": "#005047",
                        "glass-border": "rgba(255, 255, 255, 0.12)",
                        "primary-container": "#947dff",
                        "inverse-on-surface": "#303036",
                        "primary": "#cabeff",
                        "secondary": "#afc6ff",
                        "on-surface-variant": "#c9c4d8",
                        "tertiary-fixed-dim": "#3cddc7",
                        "on-tertiary": "#003731",
                        "background": "#131318",
                        "tertiary": "#3cddc7",
                        "surface-dim": "#131318",
                        "surface-bright": "#39383e",
                        "inverse-primary": "#603ce2",
                        "on-secondary-container": "#d5e0ff",
                        "surface-tint": "#cabeff",
                        "on-secondary-fixed-variant": "#004398",
                        "primary-fixed-dim": "#cabeff",
                        "inverse-surface": "#e4e1e9",
                        "surface-container-lowest": "#0e0e13",
                        "on-primary-fixed": "#1c0062",
                        "on-primary-container": "#2a0088",
                        "on-primary": "#31009a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "24px",
                        "stack-md": "16px",
                        "container-max": "1280px",
                        "unit": "4px",
                        "margin-mobile": "20px",
                        "stack-lg": "32px",
                        "margin-desktop": "40px",
                        "stack-sm": "8px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Inter"],
                        "label-md": ["Inter"],
                        "label-sm": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "display-lg": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg": ["40px", {"lineHeight": "1.2", "letterSpacing": "-0.03em", "fontWeight": "600"}],
                        "label-md": ["14px", {"lineHeight": "1.4", "letterSpacing": "0.02em", "fontWeight": "500"}],
                        "label-sm": ["12px", {"lineHeight": "1.2", "letterSpacing": "0.05em", "fontWeight": "600"}],
                        "body-md": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}],
                        "headline-md": ["24px", {"lineHeight": "1.3", "letterSpacing": "-0.01em", "fontWeight": "500"}],
                        "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
                        "headline-lg-mobile": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "600"}],
                        "display-lg": ["64px", {"lineHeight": "1.1", "letterSpacing": "-0.04em", "fontWeight": "600"}]
                    }
                },
            },
        }
    </script>
</head>
<body class="bg-background text-text-primary flex flex-col min-h-screen">
<div class="aurora-bg"></div>
<!-- Navigation Shell suppressed for Transactional Modal Focus -->
<main class="flex-grow flex items-center justify-center p-gutter">
<!-- Connect Wallet Modal -->
<div class="glass-card w-full max-w-[480px] rounded-xl overflow-hidden animate-in fade-in zoom-in duration-500">
<div class="p-stack-lg flex flex-col gap-stack-md">
<!-- Header -->
<div class="text-center">
<h1 class="font-headline-md text-headline-md text-text-primary mb-1">Conecte sua carteira</h1>
<p class="font-body-md text-body-md text-text-secondary">Escolha como você deseja se conectar à Aura.</p>
</div>
<!-- Wallet Options -->
<div class="flex flex-col gap-stack-sm mt-stack-md">
<!-- WalletConnect (Primary/Highlighted) -->
<button class="w-full group flex items-center justify-between p-4 rounded-lg bg-aurora-violet/10 border border-aurora-violet/30 hover:bg-aurora-violet/20 transition-all duration-300 active:scale-[0.98]">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-aurora-violet flex items-center justify-center">
<span class="material-symbols-outlined text-white" data-icon="account_balance_wallet">account_balance_wallet</span>
</div>
<div class="text-left">
<span class="block font-label-md text-label-md text-text-primary">WalletConnect</span>
<span class="block text-[11px] text-aurora-teal font-semibold uppercase tracking-wider">Recomendado</span>
</div>
</div>
<span class="material-symbols-outlined text-text-secondary group-hover:translate-x-1 transition-transform" data-icon="chevron_right">chevron_right</span>
</button>
<!-- MetaMask -->
<button class="w-full group flex items-center justify-between p-4 rounded-lg bg-white/5 border border-transparent hover:border-glass-border hover:bg-white/10 transition-all duration-300 active:scale-[0.98]">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-[#F6851B]/20 flex items-center justify-center">
<img alt="MetaMask" class="w-6 h-6" data-alt="Close-up of the MetaMask fox logo in high definition, with vibrant orange tones and a minimalist clean vector style. The icon is centered against a soft, dark-themed translucent glass background, maintaining the luxurious and futuristic financial technology aesthetic of the Aura Finance brand." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDQ0t8Edu54h9TF865-sip-9uCR8IaZyCux6c4ckmZF6L2YuaqXT8soJj0wS0BKy6TBsxz-Vk_H5gfrM-ueIVMNBT4FIqShLWalrTwmgyI8JUOYZwelHXIFGDjCQPTPCMPgusPpaM1fNWNu1s3MkLvupYXBx18jxh2R6wSGa-B4mv8wZFbfzCtdGszAh0gAE8IZO9yhVzyQhr2b4ORI-heqT-UQ0C_qhlEjSzM5wSLQTOPU5EfXvgifkIAJxrKpIIz60FE4YM7jHw"/>
</div>
<span class="font-label-md text-label-md text-text-primary">MetaMask</span>
</div>
<span class="material-symbols-outlined text-text-secondary group-hover:translate-x-1 transition-transform" data-icon="chevron_right">chevron_right</span>
</button>
<!-- Coinbase Wallet -->
<button class="w-full group flex items-center justify-between p-4 rounded-lg bg-white/5 border border-transparent hover:border-glass-border hover:bg-white/10 transition-all duration-300 active:scale-[0.98]">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-[#0052FF]/20 flex items-center justify-center">
<div class="w-6 h-6 bg-[#0052FF] rounded-md flex items-center justify-center">
<div class="w-3 h-3 bg-white rounded-sm"></div>
</div>
</div>
<span class="font-label-md text-label-md text-text-primary">Coinbase Wallet</span>
</div>
<span class="material-symbols-outlined text-text-secondary group-hover:translate-x-1 transition-transform" data-icon="chevron_right">chevron_right</span>
</button>
<!-- Rainbow -->
<button class="w-full group flex items-center justify-between p-4 rounded-lg bg-white/5 border border-transparent hover:border-glass-border hover:bg-white/10 transition-all duration-300 active:scale-[0.98]">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-gradient-to-tr from-[#001AFF] to-[#00E0FF] flex items-center justify-center">
<span class="material-symbols-outlined text-white" data-icon="looks">looks</span>
</div>
<span class="font-label-md text-label-md text-text-primary">Rainbow</span>
</div>
<span class="material-symbols-outlined text-text-secondary group-hover:translate-x-1 transition-transform" data-icon="chevron_right">chevron_right</span>
</button>
</div>
<!-- Footer Security Message -->
<div class="mt-stack-lg pt-stack-md border-t border-glass-border flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-aurora-teal text-[18px]" data-icon="lock" style="font-variation-settings: 'FILL' 1;">lock</span>
<p class="font-label-sm text-label-sm text-text-secondary">Conexão segura. Nunca pedimos sua chave privada.</p>
</div>
</div>
</div>
</main>
<!-- Branding Anchor -->
<div class="fixed bottom-gutter left-0 right-0 flex justify-center pointer-events-none">
<div class="flex items-center gap-2 opacity-40">
<span class="font-headline-md text-headline-md font-bold tracking-tight text-text-primary">Aura</span>
<span class="font-label-sm text-label-sm uppercase tracking-widest text-aurora-teal">Finance</span>
</div>
</div>
<!-- Background Decoration -->
<div class="fixed top-0 left-0 w-full h-full pointer-events-none overflow-hidden -z-10">
<div class="absolute w-[600px] h-[600px] bg-aurora-violet/10 blur-[120px] rounded-full -top-48 -left-48 transition-all duration-[3000ms] ease-in-out" id="aurora-light"></div>
<div class="absolute w-[500px] h-[500px] bg-aurora-teal/5 blur-[100px] rounded-full -bottom-24 -right-24 transition-all duration-[5000ms] ease-in-out" id="aurora-teal"></div>
</div>
<script>
        // Micro-interaction for background light movement
        const lightViolet = document.getElementById('aurora-light');
        const lightTeal = document.getElementById('aurora-teal');
        
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth) * 20;
            const y = (e.clientY / window.innerHeight) * 20;
            
            lightViolet.style.transform = `translate(${x}px, ${y}px)`;
            lightTeal.style.transform = `translate(${-x}px, ${-y}px)`;
        });
    </script>
</body></html>
